events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name localhost;

        # Route root to the Zomato Clone application
        location / {
            resolver 127.0.0.11 valid=30s;
            set $upstream http://zomato-clone:80;
            proxy_pass $upstream;
            proxy_redirect off;
        }

        # Jenkins Route
        location /jenkins/ {
            proxy_pass http://jenkins:8080/jenkins/;
            proxy_redirect off;

            # Required for Jenkins live logs, websockets, and agent UI connection
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SonarQube Route
        location /sonarqube/ {
            proxy_pass http://sonarqube:9000/sonarqube/;
            proxy_redirect off;
        }

        # Nexus Repository Route
        location /nexus/ {
            proxy_pass http://nexus:8081/nexus/;
            proxy_redirect off;
            client_max_body_size 1000M; # Support large artifact uploads
        }

        # Prometheus Route
        location /prometheus/ {
            proxy_pass http://prometheus:9090/prometheus/;
            proxy_redirect off;
        }

        # Grafana Route
        location /grafana/ {
            proxy_pass http://grafana:3000/grafana/;
            proxy_redirect off;
            
            # Required for Grafana websocket live updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
