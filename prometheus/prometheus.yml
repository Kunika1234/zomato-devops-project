global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jenkins'
    metrics_path: '/jenkins/prometheus/'
    static_configs:
      - targets: ['jenkins:8080']

  - job_name: 'sonarqube'
    metrics_path: '/sonarqube/api/monitoring/metrics'
    bearer_token: 'my_sonar_passcode'
    static_configs:
      - targets: ['sonarqube:9000']

  - job_name: 'nexus'
    metrics_path: '/nexus/service/metrics/prometheus'
    basic_auth:
      username: 'admin'
      password: 'admin123'
    static_configs:
      - targets: ['nexus:8081']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'demo-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['demo-app:5000']
