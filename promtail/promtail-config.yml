server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

    pipeline_stages:
      # Parse the Docker JSON log structure to extract the raw log payload
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time

      # If the log is from the Express app, parse its internal JSON structure
      - json:
          expressions:
            app_level: level
            app_message: message
            app_method: method
            app_path: path
            app_statusCode: statusCode
          source: output

      # Inject labels for Loki query indexing
      - labels:
          stream:
          app_level:
          app_method:
          app_statusCode:
